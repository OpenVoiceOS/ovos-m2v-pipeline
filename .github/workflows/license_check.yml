name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      system_deps: 'swig libssl-dev'
      # skops is not on PyPI (pip-license-checker reports Error); tqdm's
      # MPL-2.0 AND MIT is classified WeakCopyleft but its primary license
      # is MIT (permissive).
      exclude_packages: '^(ovos.m2v.pipeline|skops|tqdm).*'
      exclude_licenses: '^(Mozilla Public License|MPL).*'
