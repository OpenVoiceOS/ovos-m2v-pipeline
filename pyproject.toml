[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_m2v_pipeline"
dynamic = ["version"]
description = "Model2Vec intent engine for OVOS"
readme = "README.md"
license = { text = "Apache License 2.0" }
authors = [{ name = "TigreGoticoLda", email = "jarbasai@mailfence.com" }]
maintainers = [{ name = "OpenVoiceOS" }]

requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # opm.pipeline entrypoints + the bus-client 2.x e2e stack need modern opm;
    # the prerelease floor lets the resolver pick it without --pre.
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-config",
    "ovos-utils>=0.3.4,<1.0.0",
    "ovos-spec-tools>=1.11.2a1",
    # model2vec 0.9.0 removed the `inference` extra. The classifier load
    # path needs scikit-learn + skops only for a LEGACY `pipeline.skops`
    # head; those two live in the `legacy` extra below and are imported
    # when such a checkpoint is read, never at import time.
    "model2vec>=0.9.0",
    # model2vec asks for `tokenizers>=0.20` with no ceiling, so under
    # `--prerelease=allow` the resolver takes 1.0.0rc2. That release ships
    # without the `fancy-regex` backend, and every model whose tokenizer
    # uses a regex `Split` pre-tokenizer then fails to load:
    # `ValueError: no system-regex backend compiled`. The default model is
    # one of them, so the plugin cannot load any model at all. The ceiling
    # belongs upstream in model2vec; it is held here until that lands.
    "tokenizers<1.0.0",
]

[project.optional-dependencies]
# Only the LEGACY checkpoint format needs these. model2vec reads a
# `pipeline.skops` head through skops and scikit-learn, which pull scipy and
# joblib with them: 151 MB of site-packages measured on python 3.11. Every
# model this plugin ships uses `head.safetensors`, which is plain numpy, so
# the runtime carried that weight for a format it never loads. A legacy
# checkpoint loaded without this extra raises
# `LegacyCheckpointExtraMissing`, which names the extra and the converter.
legacy = [
    "scikit-learn",
    "skops",
]
test = [
    "pytest",
    "pytest-cov",
    "numpy",
    # INTENT-4 consumer e2e stack floor (ovos.intent.register.* topics +
    # E2EPipelineHarness namespace flags). Mirrors ovos-test-harness@dev.
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-spec-tools>=1.11.2a1",
    "ovoscope>=1.8.1a1",
    "pandas>=1.5.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=5.1",
    "pyarrow>=10.0.0",
]

[project.urls]
Homepage = "https://openvoiceos.org"
Repository = "https://github.com/OpenVoiceOS/ovos-m2v-pipeline"
Funding = "https://nlnet.nl/project/OpenVoiceOS"

[project.scripts]
ovos-m2v-prototypes = "ovos_m2v_pipeline.cli:main"

[project.entry-points."opm.pipeline"]
ovos-m2v-pipeline = "ovos_m2v_pipeline:Model2VecIntentPipeline"
ovos-m2v-prototype-pipeline = "ovos_m2v_pipeline:Model2VecPrototypePipeline"

[tool.setuptools]
packages = ["ovos_m2v_pipeline"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ovos_m2v_pipeline.version.__version__" }
