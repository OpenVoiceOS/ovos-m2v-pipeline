[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_m2v_pipeline"
dynamic = ["version"]
description = "Model2Vec intent engine for OVOS"
readme = "README.md"
license = { text = "Apache License 2.0" }
authors = [{ name = "TigreGoticoLda", email = "jarbasai@mailfence.com" }]
maintainers = [{ name = "OpenVoiceOS" }]

requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # opm.pipeline entrypoints + the bus-client 2.x e2e stack need modern opm;
    # the prerelease floor lets the resolver pick it without --pre.
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-config",
    "ovos-utils>=0.3.4,<1.0.0",
    "ovos-spec-tools>=1.11.2a1",
    # model2vec 0.9.0 removed the `inference` extra; the classifier
    # (StaticModelPipeline) load path now needs scikit-learn + skops
    # directly to deserialize the legacy sklearn head.
    "model2vec>=0.9.0",
    # model2vec asks for `tokenizers>=0.20` with no ceiling, so under
    # `--prerelease=allow` the resolver takes 1.0.0rc2. That release ships
    # without the `fancy-regex` backend, and every model whose tokenizer
    # uses a regex `Split` pre-tokenizer then fails to load:
    # `ValueError: no system-regex backend compiled`. The default model is
    # one of them, so the plugin cannot load any model at all. The ceiling
    # belongs upstream in model2vec; it is held here until that lands.
    "tokenizers<1.0.0",
    # the classifier head is read on its own when the embedding is shared
    "safetensors",
    "scikit-learn",
    "skops",
]

[project.optional-dependencies]
test = [
    # Measured floor for the --import-mode=importlib in [tool.pytest.ini_options]:
    # 7.0.0 collects all 712 tests under it. 6.2.5 cannot run this dependency
    # set at all, because the installed anyio plugin imports _pytest.scope.
    "pytest>=7.0",
    "pytest-cov",
    "numpy",
    # INTENT-4 consumer e2e stack floor (ovos.intent.register.* topics +
    # E2EPipelineHarness namespace flags). Mirrors ovos-test-harness@dev.
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-spec-tools>=1.11.2a1",
    "ovoscope>=1.8.1a1",
    "pandas>=1.5.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=5.1",
    "pyarrow>=10.0.0",
]

[project.urls]
Homepage = "https://openvoiceos.org"
Repository = "https://github.com/OpenVoiceOS/ovos-m2v-pipeline"
Funding = "https://nlnet.nl/project/OpenVoiceOS"

[project.scripts]
ovos-m2v-prototypes = "ovos_m2v_pipeline.cli:main"

[project.entry-points."opm.pipeline"]
ovos-m2v-pipeline = "ovos_m2v_pipeline:Model2VecIntentPipeline"
ovos-m2v-prototype-pipeline = "ovos_m2v_pipeline:Model2VecPrototypePipeline"

[tool.setuptools]
packages = ["ovos_m2v_pipeline"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ovos_m2v_pipeline.version.__version__" }


[tool.pytest.ini_options]
# Seven test modules do `from tests.X import ...`, which needs the repository
# root to be importable. The obvious key, `pythonpath = ["."]`, does that and
# also puts the root FIRST on sys.path, so the flat-layout `ovos_m2v_pipeline/`
# directory shadows the installed wheel and the suite stops testing what was
# built. gh-automations#159 moved CI to the `pytest` console script to obtain
# that guarantee; the key silently gives it back.
#
# importlib mode inserts nothing into sys.path, so the wheel stays the thing
# under test and the seven modules still resolve. Measured with the wheel
# installed non-editable, a raise planted in the repository-root copy, and the
# console script: 0 hits on the planted copy, 712 tests collected.
addopts = "--import-mode=importlib"
