  reason: 'ovos-skill-weather#264 (c0459e11) removed this spelling: it deleted the
    file in 18 locales and renamed it in 4. ovos-skill-weather#258 (66f7fe96) is
    the later change and removed only the underscored name #264 left behind, which
    the baseline never carried. The file sat under vocabulary/condition/, and the
    skill registers only intents/*.intent, so the label was never routable at
    runtime. Its 631 lines, in the 21 umbrella files the builder reads at the
    weather pin 64900360, moved into each locale''s weather_condition.intent, where
    en-US already carried them. No file ends with a newline, so wc -l reports 610.
    Count the lines per file with: for f in $(git ls-tree -r --name-only 64900360
    | grep -E "umbrella.*\.intent$"); do git show 64900360:$f | grep -c ''''; done
    | awk ''{s+=$1} END {print s}''. A 22nd path at that pin,
    da-DK/.../do-i-need-an-umbrella-intent, has no dot before intent, so the
    builder never reads it'
  merged_into: ovos-skill-weather.openvoiceos:weather_condition
- label: ovos-skill-weather.openvoiceos:do.i.need.an.umbrella
  reason: 'the second spelling of the same orphan file. ovos-skill-weather#264
    (c0459e11) renamed it and ovos-skill-weather#258 (66f7fe96) then folded it into
    the same weather_condition.intent. It is a second label and not a second
    intent: two files, one meaning, and neither one ever reached a handler'
  merged_into: ovos-skill-weather.openvoiceos:weather_condition
