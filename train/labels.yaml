# The label ledger.
#
# The corpus must never quietly shrink, and a bare floor cannot tell a label
# that left on purpose from a label whose resource was deleted by mistake. It
# reports one number, and the only repair it offers is to lower itself, which
# deletes the signal it exists to raise. So the floor is a list.
#
# `baseline` is the label set of the last published corpus, v6.1, read from
# the published dataset. `removed` names every label the pins in
# sources.yaml drop against that set, with the reason it left and the label
# its phrasings went to. `added` names every label they add. The builder
# derives --min-labels as 232 minus the removals plus the additions, and
# refuses a loss that is not listed here. No floor is typed by hand.
#
# The ledger may lead the pins: an entry is written the day the change is
# read in a skill, and the pin that carries it into the corpus moves later.
# A listed removal that has not happened yet is reported, not refused.
#
# Measured 2026-09-28 against every skill_ref at its current head: 232
# baseline labels, 20 removed, 14 added, 226 trained.
