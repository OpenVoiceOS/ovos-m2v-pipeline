# Pinned source manifest for train/build_dataset.py.
#
# Every entry names an immutable revision. The builder fails loudly when a
# revision cannot be resolved, so a moved branch can never silently change the
# corpus. Bump a revision here, re-run the builder, and the manifest it writes
# records exactly which revisions produced the outputs.

version: 2

# Local clones the git sources are read from. Override with --workspace.
workspace: "~/AgentWorkspaces"

git_sources:

  - id: ovos-localize
    kind: localize_jsonl
    repo: https://github.com/OpenVoiceOS/ovos-localize
    path: ovos/web/ovos-localize
    revision: a88aae4442f5c616295e4500ed05e87ba16f3f22
    files: "data/datasets/classification/*.jsonl"
    license: "Apache-2.0 (OVOS skill locale files, community translations)"
    columns:
      lang: lang
      skill_id: skill
      intent: intent
      utterance: text
    notes: >
      Keyed on intent FILE names, so `intent` carries a `.intent` / `.voc`
      suffix that the label normaliser strips. `file_type: voc` rows are
      Adapt keyword lists, not utterances, and are dropped.
    exclude:
      file_type: [voc]

  - id: lang-support-tracker
    kind: tracker_csv
    repo: https://github.com/OpenVoiceOS/lang-support-tracker
    path: ovos/tools/lang-support-tracker
    revision: 92ac8cd2f99605b50c754824d5377dee2fff681c
    files: "skills/intents_{lang}.csv"
    langs: [ca, da, de, en, es, eu, fr, gl, it, nl, pt]
    license: "Apache-2.0"
    columns:
      skill_id: domain
      intent: intent
      utterance: utterance
      lang: "<from filename>"

  # Pipeline-plugin families. Their locale `.intent` templates are expanded in
  # place; `.voc` files are Adapt keyword lists and are never used as
  # utterances.
  - id: ocp-pipeline
    kind: plugin_intents
    family: ocp
    pipeline_id: ocp
    repo: https://github.com/OpenVoiceOS/ovos-ocp-pipeline-plugin
    path: ovos/plugins/pipeline/ovos-ocp-pipeline-plugin
    revision: f198b8584916e9d7a0c14a02cbdcf565427de571
    files: "**/locale/*/*.intent"
    license: "Apache-2.0"

  - id: common-query-pipeline
    kind: plugin_intents
    family: common_query
    pipeline_id: common_query
    repo: https://github.com/OpenVoiceOS/ovos-common-query-pipeline-plugin
    path: ovos/plugins/pipeline/ovos-common-query-pipeline-plugin
    revision: 787594a3c6c1ee2adcd4980da01565bbc9cae20f
    files: "**/locale/*/*.intent"
    license: "Apache-2.0"
    extra_intents: [common_query]
    notes: >
      `common_query` is not a resource file: it is the umbrella label the
      pipeline itself answers under, mapped by the plugin to the
      `common_query.question` topic. The repo's only `.intent` file belongs
      to a test-fixture skill and is not a registration; test paths are
      excluded on read.

  - id: persona-pipeline
    kind: plugin_intents
    family: persona
    pipeline_id: persona
    repo: https://github.com/OpenVoiceOS/ovos-persona
    path: ovos/plugins/pipeline/ovos-persona
    revision: b9a2a880ffc49d77852b91b96e51ed8c2bb25235
    files: "**/locale/*/*.intent"
    license: "Apache-2.0"

  - id: stop-pipeline
    kind: plugin_intents
    family: stop
    pipeline_id: stop
    repo: https://github.com/OpenVoiceOS/ovos-core
    path: ovos/core/ovos-core
    revision: 996b4483772491c0c7d19ae0c0496115446ee2ea
    files: "ovos_core/intent_services/locale/*/*.intent"
    license: "Apache-2.0"
    notes: >
      The stop pipeline ships inside ovos-core rather than a standalone plugin
      repo; `stop.intent` carries the `stop:stop` umbrella label the plugin
      already special-cases, `global_stop.intent` becomes `stop:global_stop`.

  - id: common-reading-pipeline
    kind: plugin_intents
    family: common_reading
    pipeline_id: common_reading
    repo: https://github.com/andlo/ovos-common-reading-pipeline-plugin
    path: ovos/plugins/pipeline/ovos-common-reading-pipeline-plugin
    revision: 8f9c29a985f6510a9aba5ea048df3125c6bc70e6
    files: "locale/*/*.intent"
    license: "GPL-3.0-or-later"
    notes: >
      A pipeline plugin in its own right (`opm.pipeline` entry point
      `ovos-common-reading-pipeline-plugin=ovos_common_reading_pipeline_plugin:CommonReadingPipeline`),
      not part of `common_query` -- the corpus's own `ReadContent` /
      `ReadContentByCollection` / `ReadContentByType` labels never belonged
      to the `common_query` registry they used to be aliased into, which is
      why they were silently dropped as unresolved.

hf_sources:

  - id: gitlocalize-legacy
    repo_id: OpenVoiceOS/OVOSGitLocalize-Intents
    revision: 6f745da797a868b635adffc017f4c9bf5b00674a
    file: ovos_gitlocalize.csv
    license: "Apache-2.0 (OVOS community translations, GitLocalize export)"
    columns:
      lang: lang
      skill_id: domain
      intent: intent
      utterance: sentence
    notes: >
      Legacy export, 95k rows over 17 languages. Every cell is quoted and
      space-padded; the reader strips quotes and whitespace before mapping.

  - id: music-queries-templates
    repo_id: OpenVoiceOS/music_queries_templates
    revision: ea676cef6c1a12c3a8979641ca1e2dccb77bebb5
    file: music_templates.csv
    license: "MIT"
    constant_label: "ocp:play"
    constant_lang: "en-US"
    columns:
      utterance: template
    notes: >
      OCP play queries as `{slot}` templates. Mirrored from
      Jarbas/music_queries_templates at the same revision; the OpenVoiceOS
      copy is the pinned one.

  - id: common-query-intents
    repo_id: Jarbas/ovos-common-query-intents
    revision: 588655fdc7e979d745afa044413874977c91fd2a
    file: common_query.csv
    license: "unstated upstream; treated as Apache-2.0 with the rest of the OVOS corpus"
    columns:
      lang: lang
      skill_id: domain
      intent: intent
      utterance: sentence

  - id: weather-intents
    repo_id: OpenVoiceOS/ovos-weather-intents
    revision: 5c3b9844185af6f7b17852fa9004d6b33f8c1837
    file: weather_intents_en.csv
    license: "unstated upstream; treated as Apache-2.0 with the rest of the OVOS corpus"
    constant_skill_id: "ovos-skill-weather.openvoiceos"
    constant_lang: "en-US"
    columns:
      intent: intent
      utterance: example

  - id: llm-augmented
    repo_id: Jarbas/ovos-llm-augmented-intents
    revision: ee702b4cf27a10090e21c9f76ef2eddd9e935d10
    file: augmented.csv
    license: "unstated upstream; synthetic, LLM-generated"
    columns:
      lang: lang
      skill_id: domain
      intent: intent
      utterance: sentence
    notes: >
      Synthetic balancing data. Resolves under the `Jarbas` namespace only;
      it is not listed by `list_datasets(author="Jarbas")`, so resolve it by
      exact id.

# Golden sentences. Per the maintainer these JOIN the train/test split rather
# than forming a pure holdout: they are stratified alongside every other row
# and keep their provenance so a golden-only slice can still be scored.
golden:
  policy: stratified
  provenance_column: source
  per_skill:
    files: "test/end2end/golden_utterances*.jsonl"
    lang_from_filename: true
    default_lang: en-US
  exclude:
    needs_manual: true

