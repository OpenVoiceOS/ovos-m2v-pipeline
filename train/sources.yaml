# Skill-id spellings older corpora use for a pipeline. Resolved to the
# pipeline id before the registry lookup, since folding cannot bridge them.
skill_id_aliases:
  ovos-ocp-pipeline-plugin: ocp
  ovos-common-query-pipeline-plugin: common_query
  ovos-common-reading-pipeline-plugin: common_query
  ovos-persona: persona
  ovos-core: stop
  ocp: ocp

# Skill ids that must never reach the corpus.
skill_blacklist:
  - ovos-skill-local-media.openvoiceos
  - ovos-skill-spotify.openvoiceos

# Intent file names that are dialog or keyword resources, not intents.
intent_blacklist:
  - no_secondary_langs

filters:
  min_chars: 2
  max_chars: 160
  min_words: 1
  # Word-salad guard: a row whose utterance is a bare unexpanded slot, or is
  # only punctuation / digits, carries no intent signal.
  drop_bare_slot: true
  drop_non_alpha: true
  # Labels with fewer than this many rows cannot be stratified into a split.
  min_rows_per_label: 2

split:
  test_size: 0.2
  seed: 42
  stratify: label
