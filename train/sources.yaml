# Skill-id spellings older corpora use for a pipeline. Resolved to the
# pipeline id before the registry lookup, since folding cannot bridge them.
skill_id_aliases:
  ovos-ocp-pipeline-plugin: ocp
  ovos-common-query-pipeline-plugin: common_query
  ovos-common-reading-pipeline-plugin: common_reading
  ovos-persona: persona
  ovos-core: stop
  ocp: ocp
  # The corpus carries these under the OpenVoiceOS author suffix the
  # skill's own maintainer never used; the registered entry point's real
  # author cannot be reached by folding, so the mapping is spelled here.
  ovos-skill-color-picker.openvoiceos: ovos-skill-color-picker.krisgesling
  ovos-skill-easter-eggs.openvoiceos: skill-easter-eggs.openvoiceos
  skill-musicassistant.openvoiceos: skill-musicassistant.oscillatelabsllc
  skill-meal-plan.openvoiceos: skill-meal-plan.oscillatelabsllc

# Skill ids that must never reach the corpus.
skill_blacklist:
  - ovos-skill-local-media.openvoiceos
  - ovos-skill-spotify.openvoiceos
  # OVOSHatchery/skill-ovos-homeassistant-vui: archived since 2023-05-16,
  # not a maintained skill_refs entry -- corpus rows under
  # skill-homeassistant.openvoiceos are dropped as a decision, not left as
  # a silent unresolved-label gap. Undo this the day the skill is revived
  # and given a skill_refs pin.
  - skill-homeassistant.openvoiceos

# Intent file names that are dialog or keyword resources, not intents.
intent_blacklist:
  - no_secondary_langs

filters:
  min_chars: 2
  max_chars: 160
  min_words: 1
  # Word-salad guard: a row whose utterance is a bare unexpanded slot, or is
  # only punctuation / digits, carries no intent signal.
  drop_bare_slot: true
  drop_non_alpha: true
  # Labels with fewer than this many rows cannot be stratified into a split.
  min_rows_per_label: 2

# What the published dataset claims, as opposed to what the corpus holds.
# A language carrying one skill's templates, or a region-less tag the corpus
# disagrees about, is real data and stays in the corpora; neither is published,
# because a published language count is read as coverage.
publish:
  # The dataset is language-level: every regional variant trains one label
  # space for its macro language. Skills keep their per-dialect locale
  # directories; this groups their rows at build time and every row keeps
  # its dialect in `lang_variant`, so the grouping is reversible.
  collapse_to_macro_language: true
  min_rows_per_lang: 0
  min_skills_per_lang: 0

split:
  test_size: 0.2
  seed: 42
  stratify: label
