# Candidate sentence-encoder backbones distilled into Model2Vec static models.
#
# train/distill.py reads this file. Each entry names a Hugging Face model and
# the revision it is distilled from, so a moved branch cannot silently change a
# backbone; `distill.py --resolve` fills an empty revision from the Hub and
# rewrites this file with the sha it resolved.
#
# `languages` lists the languages a backbone is trained for. A backbone with
# `languages: [mul]` is multilingual and is the fallback for any language with
# no dedicated entry.
#
# `selected` names the backbone a language's model is built from. It stays
# empty until a build measures the candidates against a corpus: an unmeasured
# preference is a guess, and the multilingual fallback is what a language gets
# until its own backbone beats it on that language's rows.
#
# The candidates come from the Hub, filtered to encoders whose card declares at
# most three languages, with the domain-specific ones (biomedical, legal, news)
# and the rerankers dropped, and the small and base sizes preferred over the
# large. A `license: unknown` entry has no licence on its card: distil it for a
# measurement if you like, but do not publish a model built from it before
# somebody establishes the terms.

